<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1c1028"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="g" x1="32" y1="8" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e2d9fb"/>
      <stop offset="60%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>

  <!-- Violet border -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none"
    stroke="#8b5cf6" stroke-opacity="0.35" stroke-width="1.2"/>

  <!-- Letter G with glow -->
  <text
    x="32" y="47"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    font-size="44"
    font-weight="800"
    text-anchor="middle"
    fill="url(#g)"
    filter="url(#glow)"
    letter-spacing="-1">G</text>
</svg>
